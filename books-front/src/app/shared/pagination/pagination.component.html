<div class="flex flex-col sm:flex-row items-center justify-between gap-4 p-5 border-t border-gray-100">
    <p class="text-sm text-gray-500">
        Affichage de
        <span class="font-semibold text-gray-800">
            {{ startItem }}–{{ endItem }}
        </span>
        sur
        <span class="font-semibold text-gray-800">
            {{ totalItems }} livres
        </span>
    </p>

    <div class="flex items-center gap-2">
        <button type="button" (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 1"
            class="px-3 py-2 border border-gray-200 rounded-lg text-gray-600 disabled:text-gray-300 disabled:cursor-not-allowed">
            Précédent
        </button>

        <button *ngFor="let page of [].constructor(totalPages); let i = index" type="button" (click)="goToPage(i + 1)"
            [class.bg-blue-600]="currentPage === i + 1" [class.text-white]="currentPage === i + 1"
            [class.border-blue-600]="currentPage === i + 1"
            class="w-10 h-10 border border-gray-200 rounded-lg font-medium">
            {{ i + 1 }}
        </button>

        <button type="button" (click)="goToPage(currentPage + 1)"
            [disabled]="currentPage === totalPages || totalPages === 0"
            class="px-3 py-2 border border-gray-200 rounded-lg text-gray-600 disabled:text-gray-300 disabled:cursor-not-allowed">
            Suivant
        </button>
    </div>
</div>
