<div class="min-h-screen bg-gray-50 p-6 md:p-10">
    <div class="max-w-5xl mx-auto mb-8">
        <a routerLink="/books"
            class="inline-flex items-center gap-2 text-sm text-gray-500 hover:text-blue-600 transition mb-5">
            <span class="text-lg">←</span>
            Retour aux livres
        </a>

        <h1 class="text-3xl font-bold text-gray-800">Détails du livre</h1>
        <p class="text-gray-500 mt-2">
            Consultez les informations du livre.
        </p>
    </div>

    <div class="max-w-5xl mx-auto bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
        <div class="h-2 bg-blue-600"></div>

        <div class="p-6 md:p-10">
            <p *ngIf="loading" class="text-gray-500">
                Chargement du livre...
            </p>

            <p *ngIf="error" class="text-red-600">
                {{ error }}
            </p>

            <div *ngIf="!loading && book as b" class="flex flex-col md:flex-row gap-10">
                <!-- Couverture -->
                <div class="w-full md:w-64 shrink-0">
                    <div class="bg-gray-100 rounded-2xl p-5 flex items-center justify-center">
                        <div
                            class="w-full aspect-[3/4] bg-white rounded-xl border border-gray-200 shadow-sm flex items-center justify-center overflow-hidden">
                            <img *ngIf="b.image; else noCover" [src]="b.image" [alt]="'Couverture de ' + b.title"
                                class="w-full h-full object-cover" />

                            <ng-template #noCover>
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 text-gray-300" fill="none"
                                    viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M12 7v14m0-14C10.5 5.5 7.5 5 3 5v14c4.5 0 7.5.5 9 2m0-14c1.5-1.5 4.5-2 9-2v14c-4.5 0-7.5.5-9 2" />
                                </svg>
                            </ng-template>
                        </div>
                    </div>
                </div>

                <!-- Informations -->
                <div class="flex-1">
                    <div class="mb-8">
                        <span
                            class="inline-block bg-blue-50 text-blue-700 text-xs font-semibold uppercase tracking-wider px-3 py-1.5 rounded-lg mb-4">
                            Livre
                        </span>

                        <h2 class="text-3xl md:text-4xl font-bold text-gray-800 leading-tight">
                            {{ b.title }}
                        </h2>
                    </div>

                    <div>
                        <div class="py-5 border-b border-gray-100">
                            <p class="text-sm text-gray-400 mb-2">Auteur</p>
                            <p class="text-lg font-semibold text-gray-800">
                                {{ b.author.name || 'Auteur inconnu' }}
                            </p>
                        </div>

                        <div class="py-5 border-b border-gray-100">
                            <p class="text-sm text-gray-400 mb-2">Année</p>
                            <p class="text-lg font-semibold text-gray-800">
                                {{ b.year }}
                            </p>
                        </div>
                    </div>

                    <div class="mt-8">
                        <a routerLink="/books"
                            class="inline-flex items-center justify-center gap-2 px-6 py-3 bg-blue-600 text-white font-medium rounded-xl hover:bg-blue-700 transition-colors shadow-sm">
                            <span>←</span>
                            Retour à la liste
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
