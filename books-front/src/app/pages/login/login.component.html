<div class="max-w-sm mx-auto">
    <div class="mb-4 p-3 rounded bg-blue-50 border border-blue-200 text-blue-800 text-sm">
        🔒 Connectez-vous pour voir les détails du livre.
    </div>

    <div class="bg-white border rounded p-6">
        <h1 class="text-2xl font-semibold mb-6 text-center">
            Connexion
        </h1>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
            <p *ngIf="errorMessage" class="text-sm text-red-600">
                {{ errorMessage }}
            </p>

            <!-- Email -->
            <div>
                <label for="email" class="block mb-1 font-medium">
                    Email
                </label>

                <input id="email" type="email" formControlName="email" class="w-full border rounded px-3 py-2"
                    placeholder="exemple@email.com" />

                <p *ngIf="
            loginForm.controls.email.touched &&
            loginForm.controls.email.hasError('required')
          " class="text-sm text-red-600 mt-1">
                    L'email est obligatoire.
                </p>

                <p *ngIf="
            loginForm.controls.email.touched &&
            loginForm.controls.email.hasError('email')
          " class="text-sm text-red-600 mt-1">
                    Veuillez saisir un email valide.
                </p>
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="block mb-1 font-medium">
                    Mot de passe
                </label>

                <input id="password" type="password" formControlName="password"
                    class="w-full border rounded px-3 py-2" />

                <p *ngIf="
            loginForm.controls.password.touched &&
            loginForm.controls.password.hasError('required')
          " class="text-sm text-red-600 mt-1">
                    Le mot de passe est obligatoire.
                </p>
            </div>

            <!-- Forgot password -->
            <div class="text-right">
                <a routerLink="/forgot-password" class="text-sm text-blue-600 hover:underline">
                    Mot de passe oublié ?
                </a>
            </div>

            <!-- Submit -->
            <button type="submit" [disabled]="loading"
                class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition disabled:opacity-50">
                {{ loading ? 'Connexion...' : 'Se connecter' }}
            </button>
        </form>

        <!-- Separator -->
        <div class="flex items-center gap-3 my-5">
            <div class="flex-1 border-t"></div>
            <span class="text-sm text-gray-500">
                Ou continuer avec
            </span>
            <div class="flex-1 border-t"></div>
        </div>

        <!-- Google -->
        <button type="button" (click)="loginWithGoogle()"
            class="w-full flex items-center justify-center gap-3 border border-gray-300 rounded py-2.5 hover:bg-gray-50 transition">
            <fa-icon [icon]="faGoogle" class="text-lg"></fa-icon>

            <span class="text-sm font-medium text-gray-700">
                Continuer avec Google
            </span>
        </button>

        <!-- Register -->
        <p class="text-sm text-center text-gray-600 mt-4">
            Pas encore de compte ?

            <a routerLink="/register" class="text-blue-600 hover:underline">
                Créer un compte
            </a>
        </p>
    </div>
</div>
