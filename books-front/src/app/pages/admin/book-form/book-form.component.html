<h1 class="text-2xl font-semibold mb-6">
    {{ bookId ? 'Modifier le livre' : 'Ajouter un livre' }}
</h1>

<form [formGroup]="bookForm" (ngSubmit)="onSubmit()" class="bg-white border rounded p-6 space-y-4 max-w-lg"
    enctype="multipart/form-data">
    <div>
        <label class="block mb-1 font-medium">Titre *</label>

        <input type="text" formControlName="title" class="w-full border rounded px-3 py-2" />

        <p *ngIf="bookForm.get('title')?.touched && bookForm.get('title')?.hasError('required')"
            class="text-red-600 text-sm mt-1">
            Le titre est obligatoire.
        </p>
    </div>

    <div>
        <label class="block mb-1 font-medium">Auteur *</label>

        <select formControlName="author" class="w-full border rounded px-3 py-2">
            <option value="">Choisir un auteur</option>

            <option *ngFor="let author of authors" [value]="author.id">
                {{ author.name }}
            </option>
        </select>

        <p *ngIf="bookForm.get('author')?.touched && bookForm.get('author')?.hasError('required')"
            class="text-red-600 text-sm mt-1">
            Veuillez choisir un auteur.
        </p>
    </div>

    <div>
        <label class="block mb-1 font-medium">Image de couverture</label>

        <img *ngIf="currentImage" [src]="currentImage" alt="Image actuelle"
            class="w-16 h-20 object-cover rounded mb-2" />

        <input type="file" accept="image/jpeg,image/png,image/webp" (change)="onImageSelected($event)"
            class="w-full border rounded px-3 py-2 text-sm file:mr-3 file:px-3 file:py-1 file:border-0 file:rounded file:bg-gray-100 file:text-gray-700 hover:file:bg-gray-200" />

        <p class="mt-1 text-xs text-gray-500">JPG, PNG ou WebP.</p>
    </div>

    <div>
        <label class="block mb-1 font-medium">Année de publication *</label>

        <input type="number" formControlName="year" class="w-full border rounded px-3 py-2" />

        <p *ngIf="bookForm.get('year')?.touched && bookForm.get('year')?.invalid" class="text-red-600 text-sm mt-1">
            Veuillez saisir une année valide.
        </p>
    </div>

    <p *ngIf="errorMessage" class="text-red-600 text-sm">
        {{ errorMessage }}
    </p>

    <div class="flex gap-3 pt-2">
        <button type="submit" [disabled]="bookForm.invalid || loading"
            class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 disabled:opacity-50">
            {{ loading ? 'Enregistrement...' : 'Enregistrer' }}
        </button>

        <button type="button" (click)="onCancel()" class="px-4 py-2 border rounded hover:bg-gray-50">
            Annuler
        </button>
    </div>
</form>
