<h1 class="text-2xl font-semibold mb-6">
    {{ authorId ? 'Modifier l’auteur' : 'Ajouter un auteur' }}
</h1>

<form [formGroup]="authorForm" (ngSubmit)="onSubmit()" class="bg-white border rounded p-6 space-y-4 max-w-lg">
    <div>
        <label class="block mb-1 font-medium">Nom *</label>

        <input type="text" formControlName="name" class="w-full border rounded px-3 py-2" />

        <p *ngIf="authorForm.get('name')?.touched && authorForm.get('name')?.hasError('required')"
            class="text-red-600 text-sm mt-1">
            Le nom est obligatoire.
        </p>
    </div>

    <p *ngIf="errorMessage" class="text-red-600 text-sm">
        {{ errorMessage }}
    </p>

    <div class="flex gap-3 pt-2">
        <button type="submit" [disabled]="authorForm.invalid || loading"
            class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 disabled:opacity-50">
            {{ loading ? 'Enregistrement...' : 'Enregistrer' }}
        </button>

        <button type="button" (click)="onCancel()" class="px-4 py-2 border rounded hover:bg-gray-50">
            Annuler
        </button>
    </div>
</form>
