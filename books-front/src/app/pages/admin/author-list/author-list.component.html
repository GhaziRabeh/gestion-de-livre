<div class="p-6">
    <div class="mb-6 flex items-center justify-between">
        <h1 class="text-2xl font-bold text-gray-800">
            Gestion des auteurs
        </h1>

        <button type="button" (click)="addAuthor()"
            class="rounded-lg bg-blue-600 px-4 py-2 text-white hover:bg-blue-700">
            + Ajouter un auteur
        </button>
    </div>

    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 mb-6">
        <input type="text" placeholder="Rechercher un auteur..." [ngModel]="searchTerm"
            (ngModelChange)="onSearchChange($event)"
            class="w-full px-4 py-3 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-500" />
    </div>

    <div *ngIf="successMessage" class="mb-4 rounded bg-green-100 p-3 text-green-700">
        {{ successMessage }}
    </div>

    <div *ngIf="errorMessage" class="mb-4 rounded bg-red-100 p-3 text-red-700">
        {{ errorMessage }}
    </div>

    <div *ngIf="loading" class="py-8 text-center text-gray-500">
        Chargement des auteurs...
    </div>

    <div *ngIf="!loading && filteredAuthors.length === 0" class="rounded-lg border bg-white p-8 text-center text-gray-500">
        Aucun auteur trouvé.
    </div>

    <div *ngIf="!loading && filteredAuthors.length > 0" class="overflow-x-auto rounded-lg border bg-white">
        <table class="w-full text-left">
            <thead class="bg-gray-100">
                <tr>
                    <th class="p-4">ID</th>
                    <th class="p-4">Nom</th>
                    <th class="p-4">Actions</th>
                </tr>
            </thead>

            <tbody>
                <tr *ngFor="let author of paginatedAuthors" class="border-t hover:bg-gray-50">
                    <td class="p-4">{{ author.id }}</td>
                    <td class="p-4">{{ author.name }}</td>

                    <td class="space-x-2 p-4">
                        <button type="button" (click)="editAuthor(author.id)"
                            class="rounded bg-amber-500 px-3 py-1 text-white hover:bg-amber-600">
                            Modifier
                        </button>

                        <button type="button" (click)="deleteAuthor(author)"
                            class="rounded bg-red-600 px-3 py-1 text-white hover:bg-red-700">
                            Supprimer
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" [totalItems]="filteredAuthors.length"
        [itemsPerPage]="itemsPerPage" (pageChange)="onPageChange($event)"></app-pagination>
</div>
